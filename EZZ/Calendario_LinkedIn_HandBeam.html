<script>
const posts=[{week:1,day:"Mar/Mié",type:"Historia personal",tc:"#6366f1",title:"El proyecto que nadie me pidió que hiciera",hook:"Nadie me lo pidió. Lo hice igual.",timing:"Martes o Miércoles · 7–9 AM",fmt:"Imagen única",vdesc:"Foto real del módulo ESP32-2432S032 con la pantalla encendida. Si no tienes foto del hardware, usa una captura del simulador de EEZ Studio. Fondo oscuro, iluminación dramática. Texto superpuesto en tipografía bold blanca con el título.",slides:null,body:`Nadie me lo pidió. Lo hice igual.

Hace unos meses decidí meterme de lleno en un proyecto que me sacó de mi zona de confort: diseñar la interfaz gráfica completa de un dispositivo médico de terapia láser de baja intensidad llamado Fisser HandBeam 10D.

10 LEDs. 3 longitudes de onda (rojo, violeta, infrarrojo). Una pantalla táctil capacitiva de 3.2 pulgadas. Un ESP32. Y yo, tratando de hacer que todo eso funcione de forma elegante y confiable.

Lo que empezó como "instalar una librería y dibujar unos botones" se convirtió en un viaje por:

→ Configurar desde cero LVGL 9.4.0 en Arduino + VS Code
→ Entender por qué mi pantalla solo mostraba negro (spoiler: el backlight)
→ Migrar de LVGL 8 a LVGL 9 y sobrevivir para contarlo
→ Diseñar toda la lógica de UI con EEZ Studio + EEZ Flow
→ Debuggear un bug que congelaba toda la pantalla al ingresar un PIN incorrecto

¿Lo más valioso que me llevé? No es el código. Es el proceso de documentar cada error, cada solución y cada decisión técnica en una bitácora que hoy tiene más de 40 entradas.

Voy a compartir ese proceso aquí, semana a semana.

Si te interesa el mundo del embedded, el diseño de UIs para hardware, o simplemente ver cómo alguien resuelve problemas técnicos reales en tiempo real... quédate. 🧲

¿Alguna vez te has embarcado en un proyecto sin que nadie te lo pidiera? ¿Qué aprendiste? 👇`,htags:"#ESP32 #LVGL #EmbeddedSystems #UIDesign #FisserHandBeam #ArduinoIDE #MedicalDevice #Firmware #LearningByDoing #TechProject #SistemaEmbebido #Programacion #Electronica #IngenieriaElectronica #DeveloperLife"},{week:2,day:"Jueves",type:"Carrusel educativo",tc:"#0ea5e9",title:"5 razones por las que LVGL es el motor gráfico que tu proyecto necesita",hook:"Si programas microcontroladores y aún no conoces LVGL, estás perdiendo tiempo. Mucho tiempo.",timing:"Jueves · 8–10 AM",fmt:"Carrusel (7 slides)",vdesc:"Diseño en tonos oscuros con acento azul eléctrico. Tipografía bold en cada portada de slide.",slides:["PORTADA: Fondo negro, texto grande: '5 razones por las que LVGL domina las UIs en microcontroladores'. Logo LVGL + ícono chip. Tu handle abajo.","RAZÓN 1: 'Corre donde otros motores ni sueñan'. Dato: 32KB RAM, 128KB Flash es todo lo que necesita.","RAZÓN 2: '+40 widgets listos'. Lista: Button, Label, TextArea, Checkbox, LED, Chart, QR Code, ButtonMatrix...","RAZÓN 3: 'Animaciones fluidas a 60fps en un MCU de $5'. Solo redibuja lo que cambió.","RAZÓN 4: 'EEZ Studio: el Figma del embedded'. Captura del editor. 'Diseñas → EEZ genera el código C.'","RAZÓN 5: 'Comunidad activa + docs reales'. +16k GitHub stars. Foro activo. Issues respondidos.","CTA: '¿Construyendo algo con LVGL? Cuéntame en comentarios 👇'. Tu handle."],body:`Si programas microcontroladores y aún no conoces LVGL, estás perdiendo tiempo. Mucho tiempo.

LVGL (Little vGL) es el motor gráfico open-source más utilizado en embedded. Y con razón.

Llevo semanas usándolo en el Fisser HandBeam 10D — dispositivo médico de terapia láser, pantalla táctil IPS de 3.2" sobre un ESP32. Aquí van las 5 razones por las que no lo cambiaría:

→ #1: Corre en hardware mínimo — 32KB RAM, 128KB Flash. Eso es todo.

→ #2: +40 widgets listos — botones, sliders, QR codes, gráficas, teclados. Sin escribir un píxel desde cero.

→ #3: Rendering inteligente — Solo redibuja las áreas que cambiaron. Animaciones fluidas donde otros frameworks muestran parpadeo.

→ #4: EEZ Studio — Diseñas tu UI visualmente, exportas el código C, lo integras.

→ #5: Comunidad y docs reales — 16k+ GitHub stars, foro activo, PRs que se responden.

La curva de entrada existe. Pero una vez que el primer flush callback funciona y ves tu widget en pantalla... ya no hay vuelta atrás.

¿Has trabajado con LVGL? ¿Qué motor gráfico usas para embedded? 👇`,htags:"#LVGL #LittlevGL #EmbeddedUI #ESP32 #Microcontroladores #UIFramework #EmbeddedSystems #ArduinoESP32 #FirmwareDevelopment #OpenSource #EEZStudio #HardwareDev #IoT #ElectronicEngineering #MakerCommunity"},{week:3,day:"Martes",type:"Historia + debugging",tc:"#ef4444",title:"Programé 3 horas. La pantalla seguía negra. Este fue el culpable.",hook:"Pantalla negra. Código sin errores. Código subido. Silencio.",timing:"Martes · 7–9 AM",fmt:"Imagen única o 2 imágenes",vdesc:"IMG 1: ESP32 con pantalla negra. Texto: '3 horas. Sin errores de compilación. Sin imagen.' IMG 2 opcional: misma pantalla encendida y funcionando. El antes y el después.",slides:null,body:`Pantalla negra. Código sin errores. Código subido. Silencio.

Si has trabajado con displays en microcontroladores, ya sabes la sensación. El compilador no se queja. El upload termina. Y sin embargo... nada.

Esto me pasó con el módulo ESP32-2432S032 y la pantalla ST7789.

El diagnóstico que tardé demasiado en encontrar: el backlight.

La pantalla no estaba rota. El código no estaba mal. La luz de fondo nunca se encendió porque usé la API incorrecta del ESP32 Core.

⚠️ El error (funciona en Core 2.x, rompe silenciosamente en Core 3.x):

ledcSetup(0, 2000, 8);
ledcAttachPin(TFT_BL, 0);
ledcWrite(0, 255);  // ← Escribe en el CANAL 0, no en el pin

✅ La solución (ESP32 Core 3.x):

ledcAttach(TFT_BL, 2000, 8);
ledcWrite(TFT_BL, 255);  // ← Primer arg = el PIN

En Core 3.x, ledcWrite() recibe el número de PIN directamente. ledcSetup() y ledcAttachPin() desaparecieron.

Tres horas de debugging por una línea. Una línea.

La moraleja: al actualizar el Core, revisa el changelog antes de asumir que tu código sigue siendo válido.

¿Cuántas horas has perdido tú en un bug que al final era algo "pequeño"? 👇`,htags:"#ESP32 #Debugging #EmbeddedDevelopment #Arduino #ESP32Core #ST7789 #Firmware #HardwareBug #LessonLearned #BacklightFix #ArduinoIDE #MicrocontrollerProgramming #Programacion #ElectronicsDev #DebuggingLife"},{week:4,day:"Jueves",type:"Carrusel comparativo",tc:"#0ea5e9",title:"Arduino IDE vs VS Code para ESP32: ¿cuál deberías usar?",hook:"Durante meses usé solo Arduino IDE. Un día cambié y ya no volví.",timing:"Jueves · 12–2 PM",fmt:"Carrusel (6 slides)",vdesc:"Tabla comparativa. Rojo suave para Arduino IDE, verde/azul para VS Code. Logos de cada herramienta.",slides:["PORTADA: Logo Arduino IDE vs Logo VS Code. '¿Cuál usar para ESP32? La respuesta te va a sorprender'. Fondo oscuro.","PROBLEMA CON ARDUINO IDE: ❌ Recompila TODO cada vez. ❌ No detecta errores hasta compilar. ❌ Autocompletado básico. ❌ Sin Git.","VENTAJAS DE VS CODE: ✅ Reutiliza objetos .o → builds más rápidos. ✅ IntelliSense en tiempo real. ✅ Git integrado. ✅ Explorador lateral.","LO IMPORTANTE: 'VS Code NO reemplaza a Arduino IDE'. Diagrama: VS Code → Arduino Extension → compilador xtensa (instalado por Arduino IDE).","CONFIGURACIÓN: 3 archivos en .vscode/: arduino.json, c_cpp_properties.json, settings.json. Ejemplo de contenido de arduino.json.","CTA: '¿Usas VS Code para tu ESP32? Cuéntame tu setup 👇'."],body:`Durante meses usé solo Arduino IDE. Un día cambié a VS Code. Ya no volví.

No es que Arduino IDE sea malo — es la base de todo. Pero cuando el proyecto crece (15+ archivos .c/.h, LVGL, código exportado por EEZ Studio), las limitaciones aparecen rápido.

Con VS Code + la extensión Arduino:

⚡ El build reutiliza archivos objeto (.o) de compilaciones anteriores — solo recompila lo que cambió.

🔴 IntelliSense detecta errores mientras escribo, antes de compilar.

🧭 Puedo navegar entre 15 archivos sin perder el contexto.

🔁 Git integrado — cada cambio queda registrado.

Lo clave: VS Code NO reemplaza a Arduino IDE. La extensión usa el MISMO compilador (xtensa-esp32-elf-g++) y el MISMO uploader (esptool.py) que Arduino IDE instaló. Solo actúa como front-end más poderoso.

Necesitas configurar 3 archivos en .vscode/:
→ arduino.json (placa, puerto, output)
→ c_cpp_properties.json (IntelliSense / includes)
→ settings.json

¿Cuál es tu setup actual para ESP32? 👇`,htags:"#VSCode #ArduinoIDE #ESP32 #EmbeddedDevelopment #DeveloperTools #IntelliSense #Firmware #ArduinoExtension #CppDevelopment #EmbeddedSystems #ProductivityTools #Programacion #Electronica #SoftwareDevelopment #Maker"},{week:5,day:"Martes",type:"Código + truco técnico",tc:"#10b981",title:"¿Cómo muestro 2 decimales... sin usar floats?",hook:"Cometí el error de intentar usar FloatToString() en EEZ Flow. No existe. Aquí está la solución real.",timing:"Martes · 7–9 AM",fmt:"Imagen de código estilizada",vdesc:"Código en Carbon.now.sh con tema dark. Mostrar versión que NO funciona (rojo) y la que SÍ funciona (verde). Si puedes, captura del display mostrando '2.34 J' en pantalla real.",slides:null,body:`Cometí el error de intentar usar FloatToString() en EEZ Flow.

No existe.

En el Fisser HandBeam 10D necesito mostrar la dosis en Joules con 2 decimales: "2.34 J", "0.08 J", "14.60 J".

EEZ Flow no tiene FloatToString(). Tampoco IntegerToString(). String.Format() tiene un bug conocido (#643) que lo hace inutilizable en producción.

La solución: el patrón ×100.

❌ Lo que quería (no existe):
FloatToString(2.34)

✅ Lo que realmente funciona:

1. Almacena el valor multiplicado por 100:
   dosis = Math.round(0.04 * treatment_time * 100)
   → 2.34 J se guarda como 234

2. Para mostrarlo, reconstruyes el decimal:
   Math.floor(dosis / 100) + "." + (dosis % 100 < 10 ? "0" : "") + dosis % 100
   → 234 = "2.34"  |  8 = "0.08"  |  1460 = "14.60"

¿Por qué funciona?
→ Los MCUs manejan enteros más eficientemente que floats.
→ Cero errores de precisión (el clásico 2.34000000001 desaparece).
→ Técnica estándar en sistemas embebidos de tiempo real.

Aplica para temperatura, voltaje, presión — cualquier valor con decimales fijos.

¿Conocías esta técnica? ¿La usas en tus proyectos? 👇`,htags:"#EEZFlow #LVGL #EmbeddedProgramming #ESP32 #ArduinoTips #FirmwareTricks #FixedPoint #NoFloats #EmbeddedSystems #CodingTips #Programacion #HardwareDev #ElectronicEngineering #CodeSnippet #TechTips"},{week:6,day:"Lunes",type:"Historia de migración",tc:"#f59e0b",title:"Migré de LVGL 8 a LVGL 9 y la API entera cambió. Lo que encontré.",hook:"Tenía un proyecto funcionando en LVGL 8. Decidí migrar a LVGL 9. Rompí todo en 10 minutos.",timing:"Lunes · 8–10 AM",fmt:"Carrusel (5 slides)",vdesc:"Slides estilo antes/después. Fondo oscuro con código resaltado. API antigua vs nueva lado a lado.",slides:["PORTADA: 'LVGL 8 → LVGL 9: Lo que cambia, lo que rompe, y cómo sobrevivir'. Logo LVGL. Fondo azul oscuro.","POR QUÉ MIGRAR: EEZ Studio genera código para LVGL 9. API más limpia y consistente. Soporte activo solo en v9.","QUÉ CAMBIÓ (Display): lv_disp_drv_t → lv_display_create(). lv_color_t* → uint8_t* en el flush callback.","QUÉ CAMBIÓ (Input + Tick): lv_indev_drv_t → lv_indev_create(). lv_tick_inc() en ISR → lv_tick_set_cb(millis).","EL PASO OCULTO: 'Limpia tu carpeta build/ completa antes de recompilar o tendrás errores de linker inexplicables.'"],body:`Tenía un proyecto funcionando en LVGL 8. Decidí migrar a LVGL 9. Rompí todo en 10 minutos.

Y fue la mejor decisión que tomé.

Resumen de lo que cambió:

🔴 LVGL 8 (API deprecada):
lv_disp_drv_t disp_drv;
lv_disp_drv_init(&disp_drv);
disp_drv.flush_cb = my_flush;
lv_disp_drv_register(&disp_drv);

🟢 LVGL 9.4.0 (API actual):
lv_display_t *disp = lv_display_create(240, 320);
lv_display_set_flush_cb(disp, my_flush);
lv_display_set_buffers(disp, buf, NULL, size, LV_DISPLAY_RENDER_MODE_PARTIAL);

¿Por qué migrar? EEZ Studio genera código optimizado para LVGL 9. Mantener dos versiones en paralelo era fuente constante de errores.

Detalle que me costó tiempo: al cambiar de versión hay que limpiar completamente la carpeta build/. Si no lo haces, el linker mezcla objetos .o de v8 con headers de v9 y los errores parecen no tener sentido.

También: si lv_conf.h tiene #include <stdint.h> a nivel global, falla en los archivos .S de LVGL. Eliminar esa línea fue parte del proceso.

¿Estás en LVGL 8 pensando en migrar? El carrusel tiene los cambios clave.

¿Preguntas? En comentarios. 👇`,htags:"#LVGL #LVGL9 #LVGLMigration #ESP32 #EmbeddedUI #Firmware #OpenSource #EEZStudio #ArduinoESP32 #EmbeddedSystems #UIFramework #TechMigration #Programacion #ElectronicEngineering #EmbeddedDev"},{week:7,day:"Miércoles",type:"Showcase de herramienta",tc:"#8b5cf6",title:"EEZ Studio: el Figma del mundo embedded que deberías conocer",hook:"¿Y si pudieras diseñar la UI de tu microcontrolador arrastrando widgets... y darle 'exportar' para obtener el código C?",timing:"Miércoles · 8–10 AM",fmt:"Carrusel (6 slides)",vdesc:"Screenshots reales de EEZ Studio: editor visual, panel de EEZ Flow, código C exportado. Usa capturas del diseño del HandBeam si las tienes.",slides:["PORTADA: Screenshot de EEZ Studio con el login del HandBeam. 'EEZ Studio: diseña tu UI embebida sin escribir una sola línea de código (todavía)'.","QUÉ ES: 'Editor WYSIWYG open-source para UIs embebidas. Compatible con LVGL 8/9'. Logo + repo.","EL FLUJO: Diagrama: EEZ Studio → Export → archivos .c/.h → src/ → VS Code → Flash → Hardware.","EEZ FLOW: Screenshot del panel lógico. 'No solo diseñas widgets. Conectas la lógica: eventos, variables, condiciones, animaciones. Todo visual.'","LO QUE GENERA: screens.c/h, eez-flow.cpp, styles.c/h, images.c/h, vars.h. Todo listo para compilar.","LIMITACIÓN HONESTA: 'EEZ genera código para LVGL 8. Con LVGL 9 hay un fix de 2 líneas en eez-flow.cpp tras cada exportación. Vale la pena igual.'"],body:`¿Y si pudieras diseñar la UI de tu microcontrolador arrastrando widgets... y darle 'exportar' para obtener el código C completo?

Eso es EEZ Studio.

Editor WYSIWYG open-source para interfaces embebidas, compatible con LVGL. Cambió completamente cómo desarrollo proyectos de displays.

En el Fisser HandBeam 10D usé EEZ Studio para 5 pantallas:
→ SplashScreen con animación de carga
→ Login con PIN y teclado numérico
→ Menú principal: LEDs, timer, cálculo de dosis
→ Settings con código QR
→ Cambio de contraseña con validación en cadena

Para cada una: arrastré widgets, definí estilos, conecté variables, programé la lógica en EEZ Flow.

EEZ exporta: screens.c, eez-flow.cpp, styles.c, images.c, vars.h. Los copio a src/, compilo, flasheo.

Lo que hay que saber: EEZ genera código para LVGL 8. Con LVGL 9 (el que uso), hay dos reemplazos de texto en eez-flow.cpp después de cada exportación. Nada más.

Open source + gratuito + activamente mantenido.

¿Lo conocías? ¿Has probado algo similar? 👇`,htags:"#EEZStudio #LVGL #EmbeddedUI #UIDesign #WYSIWYG #OpenSource #ESP32 #EmbeddedSystems #EEZFlow #FirmwareDevelopment #Programacion #ElectronicEngineering #HardwareDev #Embedded #MakerTools"},{week:8,day:"Martes",type:"Reflexión sobre IA",tc:"#06b6d4",title:"La IA no escribió mi código. Pero redujo semanas a días.",hook:"La pregunta no es si la IA puede programar. La pregunta es cómo cambias tú cuando la usas bien.",timing:"Martes · 7–9 AM",fmt:"Imagen única conceptual",vdesc:"Pantalla mostrando código LVGL en un lado y conversación con IA en el otro. Paleta azul oscuro. Texto: 'El 80% del código lo escribí yo. El 100% de los problemas los resolví más rápido con IA.'",slides:null,body:`La pregunta no es si la IA puede programar. La pregunta es cómo cambias tú cuando la usas bien.

Durante el desarrollo del Fisser HandBeam 10D, usé IA como copiloto de forma intensiva. No para que escribiera el código, sino para que me ayudara a pensar.

Casos concretos donde me ahorró tiempo real:

🔍 Diagnóstico de errores crípticos:
Cuando el linker devolvía "undefined reference to 'get_var_output_keyboard'" a las 11pm, la IA explicó en 2 minutos por qué las variables 'Native' en EEZ Studio necesitan implementación manual en C.

📐 Coordenadas del touch GT911:
El touch capacitivo reporta en landscape cuando el display está en portrait. La IA entregó el mapa de transformaciones para las 4 rotaciones posibles. Verificadas y funcionando.

🧩 Arquitectura de variables:
Al intentar usar la misma variable para el PIN almacenado y el campo de entrada, la IA explicó el principio de responsabilidad única aplicado a UI. Resultado: stored_password nunca se vincula a ningún widget visible.

📖 Documentación:
40+ entradas en la bitácora del proyecto, estructuradas y escritas con rigor.

Lo que NO hace la IA: no sabe qué quieres construir. No conoce las restricciones de tu hardware. No sabe por qué ese bug aparece solo en el dispositivo físico.

Eso lo pones tú.

La IA es un multiplicador. Si eres bueno, te vuelve mejor.

¿Cómo estás usando IA en tu flujo de trabajo? 👇`,htags:"#InteligenciaArtificial #AI #ClaudeAI #EmbeddedDevelopment #ESP32 #LVGL #AITools #DeveloperLife #Programacion #AIAssistant #CopilotCoding #FutureOfWork #TechReflection #Firmware #InovacionTecnologica"},{week:9,day:"Jueves",type:"Bug showcase + solución",tc:"#ef4444",title:"Este bug congeló toda mi pantalla médica. Y la causa era absurda.",hook:"PIN incorrecto. Aparece el mensaje de error. El usuario toca OK. Y la pantalla... muere.",timing:"Jueves · 8–10 AM",fmt:"Carrusel (4 slides)",vdesc:"Slides dramáticos. Fondo rojo oscuro para el problema, verde oscuro para la solución.",slides:["EL BUG: UI del login con texto rojo encima: '🚨 Bug crítico: PIN incorrecto → pantalla congelada. Todo el touchscreen muere.'","LA CAUSA: Diagrama del MessageBox de EEZ Studio. 'MessageBox está como work in progress. En LVGL 9, el overlay modal no se destruye al presionar OK. Ningún evento de touch pasa.'","LA SOLUCIÓN: Diagrama del Container+Label. Variables: show_notification + notification_text. Flow: set_text → show=true → Delay 1500ms → show=false.","LA LECCIÓN: 'No todos los widgets están production-ready. Lee los issues de GitHub antes de confiar en un widget para hardware real. Siempre ten un Plan B.' CTA: '¿Has tenido bugs así? 👇'"],body:`PIN incorrecto. Aparece el mensaje de error. El usuario toca OK. Y la pantalla... muere.

Todo el touchscreen deja de responder. Los botones no hacen nada. El único escape: reiniciar el dispositivo.

Este fue uno de los bugs más frustrantes del Fisser HandBeam 10D.

🔍 El culpable: el widget MessageBox de EEZ Studio.

En el simulador todo funcionaba perfecto. En el hardware real con LVGL 9.4.0, el overlay modal del MessageBox nunca se destruía correctamente. El objeto LVGL quedaba en memoria bloqueando todos los eventos de input.

EEZ Studio marca MessageBox internamente como "work in progress". Un detalle pequeño con consecuencias enormes.

🛠️ La solución — sistema propio:
→ Un Container con un Label hijo
→ Variables: show_notification (boolean) y notification_text (string)
→ Container Hidden Expression: !show_notification
→ Flow: set_text → show=true → Delay 1500ms → show=false

El resultado es mejor que el MessageBox original: más control, auto-desaparece, color por tipo (error/éxito), y FUNCIONA en hardware.

La lección: no todo lo que funciona en simulador funciona en hardware. Los overlays modales, la gestión de memoria, los timers — todo se comporta diferente cuando el metal es real.

¿Has tenido bugs que solo aparecen en el dispositivo físico? 👇`,htags:"#Debugging #ESP32 #LVGL #EEZStudio #EmbeddedBug #Firmware #HardwareBug #MessageBox #EmbeddedUI #ElectronicEngineering #Programacion #FirmwareDevelopment #RealtimeSystems #BugFix #EmbeddedSystems"},{week:10,day:"Lunes",type:"Carrusel de valor técnico",tc:"#0ea5e9",title:"7 expresiones de EEZ Flow que todo desarrollador embedded debería conocer",hook:"EEZ Flow no tiene FloatToString(). Tampoco IntegerToString(). Pero con estas 7 expresiones puedes hacer casi cualquier cosa.",timing:"Lunes · 8–10 AM",fmt:"Carrusel (9 slides)",vdesc:"Fondo #0d1117 estilo GitHub dark. Código monoespaciado con syntax highlighting. Una expresión por slide con caso de uso y resultado.",slides:["PORTADA: '7 expresiones de EEZ Flow que deberías guardar ahora mismo'. Fondo dark, acento azul. Logo EEZ Studio.","TIEMPO MM:SS: Math.floor(t/60)+':'+(t%60<10?'0':'')+t%60 → Resultado: '03:45'","DECIMALES SIN FLOATS: Math.floor(v/100)+'.'+(v%100<10?'0':'')+v%100 → 234 = '2.34'","COLOR LED REACTIVO: check_R?0xff0000:0x000000 — TIP: SPECIFIC→Color, NO STYLE.","DESHABILITAR PLAY: is_running||treatment_time==0 — directo en DISABLED FLAGS.","MOSTRAR/OCULTAR: !show_notification — directo en FLAGS→Hidden.","LEER TECLA ButtonMatrix: KEYS[Event.getKey(e)]","TOGGLE BOOLEAN: !eyeOpen — en CLICKED event del botón ojo.","CTA: 'Guarda este carrusel. Y si conoces otra expresión útil de EEZ Flow, compártela 👇'"],body:`EEZ Flow no tiene FloatToString(). Tampoco IntegerToString(). String.Format() tiene un bug conocido (#643).

Pero con estas 7 expresiones puedes manejar casi cualquier situación de UI embebida.

Las uso todas en el Fisser HandBeam 10D:

1️⃣ TIEMPO MM:SS
Math.floor(t / 60) + ":" + (t % 60 < 10 ? "0" : "") + t % 60

2️⃣ DECIMALES SIN FLOATS (patrón ×100)
Math.floor(val / 100) + "." + (val % 100 < 10 ? "0" : "") + val % 100

3️⃣ COLOR LED REACTIVO (sin distorsión de brillo)
check_R ? 0xff0000 : 0x000000
⚠️ Usar SPECIFIC → Color, NO STYLE

4️⃣ DESHABILITAR BOTÓN PLAY
is_running || treatment_time == 0

5️⃣ MOSTRAR/OCULTAR ELEMENTO
!show_notification  (en FLAGS → Hidden)

6️⃣ LEER TECLA EN BUTTONMATRIX
KEYS[Event.getKey(e)]

7️⃣ TOGGLE BOOLEAN
!eyeOpen  (SetVariable en CLICKED event)

Guarda el carrusel. Y si conoces una expresión que debería estar aquí, los comentarios son tuyos. 👇`,htags:"#EEZFlow #EEZStudio #LVGL #ESP32 #EmbeddedUI #CodeSnippets #FirmwareTips #EmbeddedDevelopment #Programacion #UILogic #ArduinoESP32 #TechTips #Embedded #HardwareDev #ElectronicEngineering"},{week:11,day:"Miércoles",type:"Actualización de progreso",tc:"#10b981",title:"Primera UI funcionando en hardware real. El momento que te cambia.",hook:"Hay un momento en un proyecto de hardware donde el código abstracto se convierte en algo que puedes tocar. Ese momento fue ayer.",timing:"Miércoles · 8–10 AM",fmt:"Video 15-30s o carrusel de fotos reales",vdesc:"IDEAL: Video mostrando la mano tocando la pantalla del ESP32, navegando entre pantallas del HandBeam. ALTERNATIVA: Carrusel de 4 fotos del hardware: SplashScreen, Login, MENU con LEDs, CAMBIO_PASSWORD.",slides:null,body:`Hay un momento específico en un proyecto de hardware donde todo lo que era código abstracto se convierte en algo tangible que puedes tocar.

Ese momento fue ayer.

El Fisser HandBeam 10D tiene su primera interfaz completa funcionando en el módulo ESP32-2432S032.

Lo que ves en el video/foto:

📱 SplashScreen — barra de progreso animada al encender

🔐 Login — PIN de 4 dígitos, teclado numérico, toggle de visibilidad. PIN incorrecto: notificación auto-desaparece. PIN correcto: navegación automática.

💊 Menú principal — Selección R/V/IR, timer MM:SS, cálculo de dosis en Joules (2 decimales, sin floats), ciclo Play/Stop/Reset.

⚙️ SETTINGS con QR Code
🔑 CAMBIO_PASSWORD con validación en cadena

Stack:

→ Arduino IDE + VS Code

12 semanas. 40+ entradas en la bitácora técnica. Una UI completa para un dispositivo médico de terapia láser, construida desde cero sobre un ESP32 de $10.

Lo que aprendí:

📝 Documenta todo. Mi bitácora tiene 40+ entradas con código, diagramas y razonamientos. Es el activo más valioso del proyecto, más que el código mismo.

🆓 Las herramientas open-source son extraordinarias. LVGL, EEZ Studio, VS Code, GFX Library: todo el stack UI del HandBeam 10D no costó un solo dólar en licencias.

🔬 El simulador miente. El bug del MessageBox nunca apareció en EEZ Studio. Solo en hardware real. Siempre testea en el dispositivo físico.

🤖 La IA es un multiplicador. Me ahorró horas de debugging en múltiples ocasiones. Pero nunca supo qué estaba construyendo hasta que yo se lo expliqué con precisión.

🎯 Sin deadline hay claridad. Cada decisión técnica se tomó por las razones correctas: escalabilidad, mantenibilidad, corrección.

¿Qué sigue? Leer la batería, controlar los LEDs físicos, NVS para el PIN, comunicación con el MCU principal.

Si seguiste esta serie: gracias. Tu atención fue el combustible. 🙏

let cur=0;
function render(){
  const p=posts[cur];
  // Sidebar
  document.getElementById('sidebar-list').innerHTML=posts.map((x,i)=>`
    <button class="post-btn${i===cur?' active':''}" onclick="go(${i})" style="border-left-color:${i===cur?x.tc:'transparent'}">
      <div class="post-btn-meta">
        <span class="wk-badge" style="background:${x.tc}22;color:${x.tc};border:1px solid ${x.tc}44">Sem ${x.week}</span>
        <span class="wk-day">${x.day}</span>
      </div>
      <div class="post-btn-title">${x.title.length>52?x.title.slice(0,52)+'…':x.title}</div>
    </button>`).join('');
  // Content
  document.getElementById('content').innerHTML=`
    <div class="post-header">
      <div class="ph-top">
        <div style="flex:1">
          <div class="badges">
            <span class="badge" style="background:${p.tc}22;color:${p.tc};border:1px solid ${p.tc}44">${p.type}</span>
            <span class="badge badge-time">📅 ${p.timing}</span>
          </div>
          <div class="main-title">${p.title}</div>
        </div>
        <div class="wk-num" style="background:${p.tc}">${p.week}</div>
      </div>
      <div class="hook-box" style="border-left:4px solid ${p.tc}">
        <span style="font-size:18px;flex-shrink:0">🪝</span>
        <div>
          <div class="hook-lbl">GANCHO — PRIMERA LÍNEA</div>
          <div class="hook-txt">"${p.hook}"</div>
        </div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab-btn active" style="background:${p.tc}" onclick="switchTab('body')">📝 Cuerpo del post</button>
      <button class="tab-btn" onclick="switchTab('visual')">🖼️ Visual / Imágenes</button>
      <button class="tab-btn" onclick="switchTab('hashtags')">＃ Hashtags</button>
    </div>
    <div class="panel active" id="panel-body">
      <div class="panel-hdr">
        <span class="panel-lbl">TEXTO COMPLETO · ${p.body.length} CARACTERES</span>
        <button class="copy-btn" id="cbody" onclick="copy(posts[${cur}].body,'cbody')">Copiar texto</button>
      </div>
      <div class="body-txt">${p.body}</div>
    </div>
    <div class="panel" id="panel-visual">
      <div class="panel-hdr"><span class="panel-lbl">GUÍA VISUAL / INSTRUCCIONES</span></div>
      <div class="vis-inner">
        <div class="fmt-box">
          <div class="fmt-lbl">FORMATO</div>
          <div class="fmt-val">${p.fmt}</div>

        <div class="fmt-lbl" style="margin-bottom:10px">DESCRIPCIÓN PARA EL DISEÑADOR</div>
        <div class="vis-desc">${p.vdesc}</div>
        ${p.slides?`<div class="slides-lbl">CONTENIDO DE CADA SLIDE</div>${p.slides.map((s,si)=>`
          <div class="slide-item">
            <div class="slide-num" style="background:${p.tc}">${si+1}</div>
            <div class="slide-txt">${s}</div>

      </div>
    </div>
    <div class="panel" id="panel-hashtags">
      <div class="panel-hdr">
        <span class="panel-lbl">HASHTAGS — ${p.htags.split(' ').length} ETIQUETAS</span>

      </div>
      <div class="hash-inner">
        <div class="hash-cloud">${p.htags.split(' ').map((t,ti)=>`<button class="hash-tag" onclick="copyTag('${t.replace(/'/g,"\\'")}',this)">${t}</button>`).join('')}</div>

          <div class="tips-lbl">💡 TIPS DE HASHTAGS PARA LINKEDIN</div>
          <div class="tips-txt">
            • En LinkedIn, 5-10 hashtags es el rango óptimo. Selecciona los más relevantes de cada post.<br>

function go(i){if(i<0||i>=posts.length)return;cur=i;render();window.scrollTo({top:0,behavior:'smooth'});}
function switchTab(t){
  const tc=posts[cur].tc;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    const tabs=['body','visual','hashtags'];
    b.classList.toggle('active',tabs[i]===t);
    b.style.background=tabs[i]===t?tc:'transparent';
  });
}
function copy(text,btnId){
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
  const btn=document.getElementById(btnId);
  if(btn){btn.classList.add('copied');btn.textContent='✓ Copiado';setTimeout(()=>{btn.classList.remove('copied');btn.textContent=btnId==='cbody'?'Copiar texto':'Copiar todos';},2000);}
  showToast();
}
function copyTag(tag,el){
  navigator.clipboard.writeText(tag).catch(()=>{
    const ta=document.createElement('textarea');ta.value=tag;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
  });
  el.style.background=posts[cur].tc+'33';el.style.borderColor=posts[cur].tc;el.style.color=posts[cur].tc;
  setTimeout(()=>{el.style.background='#131c2e';el.style.borderColor='#1e3a5f';el.style.color='#60a5fa';},1500);
  showToast();
}
function showToast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
render();
</script>
